<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira · Widget nativi Cozy</title>
<link rel="stylesheet" href="./mira-native-theme.css">
<style>
body{margin:0 auto;max-width:800px;padding:8px;font:16px system-ui,sans-serif}a{color:inherit}.settings{display:grid;gap:10px;margin:16px 0}.settings label{display:grid;gap:4px}.settings select{font:inherit;min-height:42px}.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.colors label{display:flex;align-items:center;gap:6px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
</style></head><body>
<a href="./theme-lab.html">← Theme Lab Cozy Edition</a><h1>Widget nativi · Cozy Balanced</h1>
<p>Una view compilata da Mira con updater specializzati; CSS e palette derivati dalla Cozy Edition originale.</p>
<div class="settings">
<label>Palette<select id="native-palette"></select></label>
<label>Carattere<select id="native-font"><option value="cozy">Cozy</option><option value="human">Humanist</option><option value="system">System</option></select></label>
<label>Dimensione <input id="native-size" type="range" min="12" max="19" value="16"></label>
<label>Spaziatura <input id="native-spacing" type="range" min="-2" max="8" step=".5" value="5"></label>
<details><summary>Personalizza i colori</summary><div class="colors" id="native-colors"></div></details>
</div>
<main class="mira-theme" id="native-theme"><div class="stage"><div class="shell"><div class="panel" id="theme-preview" aria-label="View nativa Mira"></div></div></div></main>
<p id="theme-status" role="status">Preparazione…</p><details><summary>Sorgente Mira</summary><pre id="theme-source"></pre></details>
<script src="./cozy-palette.js"></script><script src="./compiler.js"></script><script src="./ui-host.js"></script><script src="./gui-specialize.js"></script><script src="./theme-lab.js"></script></body></html>
