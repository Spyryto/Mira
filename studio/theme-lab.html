<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira — Cozy Balanced</title><style>body{margin:0 auto;max-width:840px;padding:16px;background:#f5e9ed;color:#39334e;font:14px/1.5 system-ui,sans-serif}body>a{color:#514688}#cozy{margin-top:16px}</style></head><body>
<a href="./index.html">← Mira Studio</a> · <a href="./theme-native-lab.html">Renderer nativo (sperimentale)</a>
<div id="cozy">
<link rel="stylesheet" href="./mira-theme.css">
<div class="chooser" id="czPresets">
<button class="preset" data-preset="0" aria-pressed="true"><span class="chips"><i style="background:#b9bde5"></i><i style="background:#969dd5"></i><i style="background:#fae9e5"></i></span>Prisma</button>
<button class="preset" data-preset="9"><span class="chips"><i style="background:#1b293d"></i><i style="background:#79d5c5"></i><i style="background:#34485f"></i></span>Notturno</button>
<button class="preset" data-preset="10"><span class="chips"><i style="background:#252c38"></i><i style="background:#f0b879"></i><i style="background:#47515e"></i></span>Grafite</button>
</div>
<div class="stage">
<div class="shell">
<svg class="waves" viewBox="0 0 800 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 140 C180 140 280 25 440 70 S650 100 800 8 V0 H0Z" fill="var(--top)" opacity=".6"/><path d="M0 176 C230 180 260 60 430 84 S650 125 800 20 V180 H0Z" fill="var(--accent)" opacity=".22"/><path d="M180 180 C400 180 520 140 800 65 V180Z" fill="var(--bottom)" opacity=".65"/></svg>
<div class="head"><div class="logo">m</div><div class="brand"><b>Mira</b><span id="czName">Prisma Balanced · Cozy</span></div></div>
<div class="toolbar"><button class="btn primary" data-act="save">Salva</button><button class="btn" data-act="reset">Ripristina</button><button class="btn" data-act="info">Info</button></div>
<div class="tabs"><button data-tab="controls" aria-selected="true">Controlli</button><button data-tab="data" aria-selected="false">Dati</button><button data-tab="options" aria-selected="false">Opzioni</button></div>
<div class="panel">
<div data-page="controls">
<div class="field"><label for="czText">Campo di testo</label><input id="czText" type="text" value="Hello, Mira!"></div>
<div class="field"><label for="czTarget">Menu a tendina</label><select id="czTarget"><option>JavaScript</option><option>PHP</option></select></div>
<div class="field"><label for="czRange">Slider</label><div class="rangebox"><input class="range" id="czRange" type="range" min="0" max="100" value="65"><output id="czPct">65%</output></div></div>
<div class="bottom"><label class="group"><input class="check" id="czPreview" type="checkbox" checked>Anteprima</label><div class="group"><span>Attivo</span><label class="switch"><input id="czActive" type="checkbox" aria-label="Attivo" checked><i></i></label></div><div class="group"><span>Contatore</span><div class="stepper"><button class="btn" data-act="minus" aria-label="Decrementa">−</button><strong id="czCount">0</strong><button class="btn" data-act="plus" aria-label="Incrementa">+</button></div></div></div>
</div>
<div data-page="data" hidden><strong>Stato corrente</strong><pre id="czData"></pre><strong>Ultimo salvataggio in memoria</strong><pre id="czSaved">Nessuno</pre></div>
<div data-page="options" hidden><label class="group"><input class="check" id="czShow" type="checkbox" checked>Mostra barra di stato</label></div>
</div>
<div class="status" id="czStatus" role="status"><i class="led"></i><span id="czMessage">Pronto</span></div>
</div>
</div>
<div class="lab">
<h3>Tipografia</h3>
<label for="czFont">Carattere</label>
<select id="czFont"><option value="cozy">Cozy — morbido e arrotondato</option><option value="human">Humanist — organico e ampio</option><option value="system">System — per confronto</option></select>
<div class="row"><label for="czSize">Dimensione</label><output id="czSizeOut">16 px</output></div>
<input id="czSize" type="range" min="12" max="19" value="16">
<div class="row"><label for="czSpacing">Spaziatura dei caratteri</label><output id="czSpacingOut">5%</output></div>
<input id="czSpacing" type="range" min="-2" max="8" step=".5" value="5">
<button class="configbtn" data-act="resetFont" style="width:100%">Ripristina tipografia Cozy</button>
</div>
<div class="lab">
<details><summary style="cursor:pointer;font-weight:600">Personalizza i colori</summary><div class="colorgrid" id="czColors"></div><button class="configbtn" style="width:100%;margin-top:12px" data-act="restore">Ripristina palette</button></details>
</div>
<div class="lab">
<h3>Contrasto del testo</h3>
<div class="contrast" id="czContrast">Calcolo del contrasto…</div>
</div>
<script src="./cozy-palette.js"></script>
<script>
(()=>{
const r=document.getElementById("cozy"),q=id=>r.querySelector("#cz"+id);
const {presets,keys,labels}=globalThis.MiraCozyTheme;
let selected=0,p=presets[0].slice(1),custom=false,count=0,saved=null;
function apply(){
q("Contrast").textContent="";
globalThis.MiraCozyTheme.apply(r,p,selected,custom).forEach(({label,ratio:n})=>{const line=document.createElement("div");line.textContent=label+": "+n.toFixed(2)+":1"+(n<4.5?" — da migliorare":"");q("Contrast").appendChild(line)});
r.querySelectorAll("[data-preset]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.preset===selected&&!custom)));
q("Name").textContent=presets[selected][0]+(custom?" Custom":" Balanced")+" · Cozy";
keys.forEach((k,i)=>q("Color"+i).value=p[i]);update();
}
function state(){return {testo:q("Text").value,target:q("Target").value,slider:+q("Range").value,anteprima:q("Preview").checked,attivo:q("Active").checked,contatore:count,tema:presets[selected][0],palette:Object.fromEntries(keys.map((k,i)=>[k,p[i]])),font:q("Font").value,dimensione:+q("Size").value,spaziatura:+q("Spacing").value,materiale:{outer:74,inner:0,inset:29,toggle:64,grain:0}}}
function update(){const s=state();globalThis.MiraCozyTheme.typography(r,s.font,s.dimensione,s.spaziatura);q("SizeOut").textContent=s.dimensione+" px";q("SpacingOut").textContent=String(s.spaziatura).replace(".",",")+"%";r.style.setProperty("--pct",s.anteprima?s.slider+"%":"0%");q("Pct").textContent=s.slider+"%";q("Count").textContent=count;r.querySelector("[data-act=minus]").disabled=r.querySelector("[data-act=plus]").disabled=!s.attivo;q("Status").hidden=!q("Show").checked;q("Data").textContent=JSON.stringify(s,null,2);q("Saved").textContent=saved?JSON.stringify(saved,null,2):"Nessuno"}
function choose(i){selected=i;p=presets[i].slice(1);custom=false;apply();q("Message").textContent="Palette applicata"}
function tab(t){r.querySelectorAll("[data-page]").forEach(x=>x.hidden=x.dataset.page!==t);r.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x.dataset.tab===t)))}
function resetFont(){q("Font").value="cozy";q("Size").value=16;q("Spacing").value=5}
q("Presets").innerHTML=[0,9,10,1,2,3,4,5,6,7,8,11].map(i=>{const a=presets[i];return `<button class="preset" data-preset="${i}"><span class="chips"><i style="background:${a[2]}"></i><i style="background:${a[4]}"></i><i style="background:${a[3]}"></i></span>${a[0]}</button>`}).join("");
q("Colors").innerHTML=labels.map((a,i)=>`<label class="colorfield"><input type="color" id="czColor${i}" data-color="${i}" value="${p[i]}">${a}</label>`).join("");
function changed(e){if(e.target.hasAttribute("data-color")){p[+e.target.dataset.color]=e.target.value;custom=true;apply()}else update()}
r.addEventListener("input",changed);r.addEventListener("change",changed);
r.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;if(b.hasAttribute("data-preset")){choose(+b.dataset.preset);return}if(b.dataset.tab){tab(b.dataset.tab);return}switch(b.dataset.act){case "plus":count++;break;case "minus":count--;break;case "save":saved=state();q("Message").textContent="Salvato in memoria";break;case "info":q("Message").textContent="Soft Touch Balanced · Cozy";break;case "restore":choose(selected);break;case "resetFont":resetFont();break;case "reset":count=0;q("Text").value="Hello, Mira!";q("Target").selectedIndex=0;q("Range").value=65;q("Active").checked=q("Preview").checked=q("Show").checked=true;tab("controls");q("Message").textContent="Pronto";break}update()});
apply();
})();
</script>
</div>
</body></html>
