<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anteprima Mira</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #39334e; background: #fff8f4; }
    body { margin: 0; padding: 15px; }
    #mira-root, #mira-root * { box-sizing: border-box; }
    .mira-ui-column, .mira-ui-grid { display: grid; gap: 12px; }
    .mira-ui-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .mira-ui-control { display: grid; gap: 5px; min-width: 0; }
    .mira-ui-label { font-size: 14px; font-weight: 700; }
    .mira-ui-input { box-sizing: border-box; width: 100%; min-width: 0;
      border: 2px solid #1e2529; border-radius: 8px; background: #fff;
      padding: 10px; font: inherit; font-size: 16px; color: inherit; }
    .mira-ui-input:focus-visible { outline: 3px solid #2a8875; outline-offset: 2px; }
    .mira-ui-check { display: flex; align-items: center; gap: 12px; }
    .mira-ui-check input { width: 22px; height: 22px; accent-color: #2a8875; }
    .mira-ui-title { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .mira-ui-text { margin: 0; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    .mira-ui-button { background: #ff965f; border: 2px solid #1e2529; border-radius: 8px;
      padding: 11px 15px; font-size: 14px; font-weight: 750; cursor: pointer; }
    .mira-ui-button:focus-visible { outline: 3px solid #2a8875; outline-offset: 2px; }
    .mira-ui-state { display: block; }
    .mira-ui-rangebox,.mira-ui-toggle,.mira-ui-stepper,.mira-ui-tabs { display:flex; gap:8px; align-items:center; }
    .mira-ui-slider-input { flex:1; min-width:0; }
    .mira-ui-step-button,.mira-ui-tabs button { font:inherit; padding:8px; cursor:pointer; }
    .mira-ui-tabs button[aria-pressed=true] { background:#ff965f; }
    .mira-ui-led::before { content:"●"; color:#2a8875; margin-right:8px; }
    .mira-ui-dialog { border: 2px solid #1e2529; border-radius: 12px; padding: 18px;
      width: min(320px, calc(100vw - 60px)); box-shadow: 4px 4px 0 #ff965f; }
    .mira-ui-dialog::backdrop { background: #1e252990; }
    .mira-ui-dialog-message { margin-top: 0; line-height: 1.5; overflow-wrap: anywhere; }
    #renderer-plan { font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #renderer-inspector { margin-bottom: 12px; border: 1px solid #b9b8ad; border-radius: 8px; padding: 8px; }
    #renderer-inspector summary { cursor: pointer; font-size: 13px; font-weight: 700; }
    #errors { color: #8f382d; font-size: 12px; white-space: pre-wrap; }
    body.mira-theme {margin:0;max-width:none;padding:15px;color:var(--pInk,#39334e);background:var(--panel,#fff8f4)}
  </style>
<link rel="stylesheet" href="./mira-native-theme.css">
</head>
<body class="mira-theme">
  <details id="renderer-inspector"><summary id="renderer-status">Renderer</summary><pre id="renderer-plan"></pre></details>
  <div id="mira-root" aria-label="View prodotta da Mira"></div>
  <div id="errors" role="alert" aria-live="assertive"></div>
  <script src="./cozy-palette.js"></script>
  <script src="./compiler.js"></script>
  <script src="./ui-host.js"></script>
  <script src="./gui-specialize.js"></script>
  <script src="./ui-preview.js"></script>
</body>
</html>
