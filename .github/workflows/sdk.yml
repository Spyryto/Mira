name: Mira SDK bootstrap
on:
  pull_request:
  push:
    branches: [main]
    tags: ['sdk-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: npm run build
      - run: haxe build-php.hxml
      - run: node scripts/build-sdk.mjs
      - run: node scripts/test-sdk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mira-sdk-${{ matrix.os }}
          path: dist/sdk/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mira-sdk-ubuntu-latest
          path: sdk
      - name: Verify tag matches bundle and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "sdk-v$(node -p "JSON.parse(require('fs').readFileSync('sdk/mira-sdk.json')).version")"
          gh release create "$TAG" sdk/* --title "Mira SDK $TAG" --notes "Verified Node/PHP bootstrap SDK."
