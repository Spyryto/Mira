name: Mira smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: node --test
      - run: node src/mira.mjs examples/arithmetic.mira js > /tmp/mira.mjs
      - run: node src/mira.mjs examples/arithmetic.mira php > /tmp/mira.php
      - run: node --check /tmp/mira.mjs
      - run: php -l /tmp/mira.php
