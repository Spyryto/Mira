name: Mira full-stack integration
on:
  push:
  pull_request:
jobs:
  fullstack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: Build Studio compiler and run browser integration
        run: npm run build:studio && node --test test/fullstack.test.mjs
      - name: Keep screenshot and latency results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-fullstack-report
          path: dist/fullstack-report/
          if-no-files-found: warn
