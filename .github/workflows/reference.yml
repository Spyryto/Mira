name: Publish generated reference

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'src/**/*.hx'
      - 'scripts/generate-reference.mjs'
      - '.github/workflows/reference.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mira-generated-reference
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate interlinked Markdown and Haxe API signatures
        run: npm run docs
      - name: Commit generated Markdown when changed
        run: |
          git add docs/reference/language.md docs/reference/examples.md docs/reference/api.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate Mira language and API reference"
            git push origin HEAD:main
          else
            echo "Reference is already up to date."
          fi
