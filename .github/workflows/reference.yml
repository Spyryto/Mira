name: Publish reference and provenance report

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'README.md'
      - 'docs/**'
      - 'src/**/*.hx'
      - 'scripts/generate-reference.mjs'
      - 'scripts/generate-documentation-origin.mjs'
      - '.github/workflows/reference.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mira-generated-reference
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate interlinked reference and documentation provenance
        run: npm run docs
      - name: Commit reference and provenance when changed
        run: |
          git add README.md docs/reference/language.md docs/reference/examples.md docs/reference/api.md docs/documentation-origin.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate Mira reference and documentation provenance"
            git push origin HEAD:main
          else
            echo "Reference is already up to date."
          fi
