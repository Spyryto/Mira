name: Mira Studio PWA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-studio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Compile Haxe browser frontend and assemble PWA
        run: npm run build:studio
      - name: Verify browser compiler and static assets
        run: node --test test/studio.test.mjs test/inspector-ui.test.mjs test/ui-host.test.mjs test/documentation-origin.test.mjs test/atlas.test.mjs test/benchmark-ui.test.mjs test/theme-lab.test.mjs test/projection.test.mjs
      - name: Verify all documented JS/PHP examples
        run: |
          npm run build
          node --test test/catalog.test.mjs test/dogfood.test.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive Studio screenshots and UX checks
        run: node scripts/studio-visual.mjs
      - name: Upload responsive Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-studio-screenshots
          path: dist/studio-screenshots/
          if-no-files-found: warn
      - name: Upload generated reference and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mira-reference-markdown
          path: |
            docs/reference/
            docs/documentation-origin.md
          if-no-files-found: error
      - name: Compare Mira Atlas runtime with handwritten JavaScript
        run: node scripts/benchmark-atlas.mjs
      - name: Upload Mira Atlas timing data
        uses: actions/upload-artifact@v4
        with:
          name: mira-atlas-benchmark
          path: dist/atlas-benchmark.json
          if-no-files-found: error
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: mira-studio-preview
          path: dist/studio/
          if-no-files-found: error
      - name: Prepare GitHub Pages bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/studio/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Mira Studio
        id: deployment
        uses: actions/deploy-pages@v4
